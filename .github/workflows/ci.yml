name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Host tests and previews (both targets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libzbar0
          python3 -m pip install --user -r tools/requirements.txt -r studio/requirements.txt
      # Builds and runs the C++ tests once per BHIHKH_TARGET (each renders at
      # its own panel size), then the Python tests and both targets' previews.
      - name: Unit, render, QR-decode and tooling tests
        run: scripts/run-host-tests.sh
      - name: Studio browser bootstrap and reconnect tests
        run: node --test tests_js/test_studio_browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: build/previews/

  firmware:
    name: Firmware cross-build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: badger2040
            build: build/fw
            prefix: badger_badge
            portrait: assets/sample/portrait_placeholder.png
            other: badger2350
          - target: badger2350
            build: build/fw-badger2350
            prefix: badger2350_badge
            portrait: assets/sample/portrait_placeholder_badger2350.png
            other: badger2040
    env:
      BHIHKH_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe for build metadata
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build python3-venv \
            gcc-arm-none-eabi=15:13.2.rel1-2 libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version | head -1
      # The asset/profile generators run under CMake's Python3_EXECUTABLE, so
      # install the pinned tooling into a venv and hand CMake that exact
      # interpreter (jobs don't share the host job's environment).
      - name: Install asset-generation Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -m pip install --upgrade pip
          "$py" -m pip install -r tools/requirements.txt
          "$py" -m pip check
          pinned=$(sed -n 's/^pillow==\([^ #]*\).*/\1/p' tools/requirements.txt)
          "$py" -c "import sys, PIL; print('Pillow', PIL.__version__, 'on', sys.executable); sys.exit(PIL.__version__ != '$pinned')"
          echo "BADGER_PYTHON=$py" >> "$GITHUB_ENV"
      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('deps.lock', 'scripts/fetch-deps.sh') }}
      - name: Fetch dependencies (verifies pinned commits)
        run: scripts/fetch-deps.sh
      - name: Build firmware (public sample content)
        run: |
          scripts/build-firmware.sh \
            -DBHIHKH_TARGET="$BHIHKH_TARGET" \
            -DPython3_EXECUTABLE="$BADGER_PYTHON" \
            -DBADGER_PROFILE="$PWD/config/sample-profile.json" \
            -DBADGER_PORTRAIT="$PWD/${{ matrix.portrait }}" 2>&1 | tee "$RUNNER_TEMP/build.log"
          # Warnings are defects (the SDK's own sources included).
          if grep -E "(warning|Warning):" "$RUNNER_TEMP/build.log"; then echo "::error::build warnings"; exit 1; fi
      - name: Memory report
        run: cat ${{ matrix.build }}/memory-report.txt | head -12
      - name: Verify artifacts (UF2 regions, linker placement, metadata, checksums)
        run: '"$BADGER_PYTHON" scripts/verify_artifacts.py ${{ matrix.build }} --require-clean --target "$BHIHKH_TARGET"'
      # The other board's facts must reject this build: a package can never
      # pass as firmware for the wrong badge. Checked on a copy of the
      # artifacts without CMakeCache.txt, so the refusal has to come from the
      # UF2s and image themselves, not from the cache naming the other target.
      - name: Artifacts are refused as the other board's
        run: |
          stage="$RUNNER_TEMP/cross-artifacts"
          mkdir -p "$stage/generated"
          (cd ${{ matrix.build }} && cp $(awk '{print $2}' SHA256SUMS) SHA256SUMS "$stage/")
          cp ${{ matrix.build }}/generated/builtin_assets.bin "$stage/generated/"
          test ! -e "$stage/CMakeCache.txt"
          if "$BADGER_PYTHON" scripts/verify_artifacts.py "$stage" --target ${{ matrix.other }} \
               --name ${{ matrix.prefix }} > "$RUNNER_TEMP/cross.txt"; then
            cat "$RUNNER_TEMP/cross.txt"; echo "::error::accepted as ${{ matrix.other }}"; exit 1
          fi
          cat "$RUNNER_TEMP/cross.txt"
          grep -q "^skip  CMakeCache.txt" "$RUNNER_TEMP/cross.txt"
          if grep -q "build directory configured" "$RUNNER_TEMP/cross.txt"; then exit 1; fi
          grep -E "^FAIL  ${{ matrix.prefix }}(-assets)?\.uf2: every block tagged family" "$RUNNER_TEMP/cross.txt"
      - name: Package and verify the release ZIP
        run: |
          "$BADGER_PYTHON" scripts/package_firmware.py ${{ matrix.build }} "$RUNNER_TEMP/${{ matrix.prefix }}.zip"
          "$BADGER_PYTHON" scripts/package_firmware.py --verify "$RUNNER_TEMP/${{ matrix.prefix }}.zip"
      # badger2040 is configured without -DBHIHKH_TARGET, so this also shows
      # the default target builds the same image.
      - name: Reproducible from a different checkout path and build-directory name
        run: |
          repro="$RUNNER_TEMP/repro"
          git clone -q "$PWD" "$repro"
          git -C "$repro" checkout -q "$GITHUB_SHA"
          ln -s "$PWD/deps" "$repro/deps"
          args=()
          [ "$BHIHKH_TARGET" = badger2040 ] || args=(-DBHIHKH_TARGET="$BHIHKH_TARGET")
          (cd "$repro" && env -u BHIHKH_TARGET BUILD_DIR="$repro/build/repro-other-name" scripts/build-firmware.sh \
            "${args[@]}" \
            -DPython3_EXECUTABLE="$BADGER_PYTHON" \
            -DBADGER_PROFILE="$repro/config/sample-profile.json" \
            -DBADGER_PORTRAIT="$repro/${{ matrix.portrait }}" > /dev/null)
          p=${{ matrix.prefix }}
          for f in $p.uf2 $p.bin $p.elf $p-assets.uf2; do
            cmp "${{ matrix.build }}/$f" "$repro/build/repro-other-name/$f"
            echo "identical: $f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-sample-${{ matrix.target }}
          path: |
            ${{ matrix.build }}/${{ matrix.prefix }}.uf2
            ${{ matrix.build }}/${{ matrix.prefix }}-assets.uf2
            ${{ matrix.build }}/${{ matrix.prefix }}.elf
            ${{ matrix.build }}/${{ matrix.prefix }}.elf.map
            ${{ matrix.build }}/${{ matrix.prefix }}.bin
            ${{ matrix.build }}/memory-report.txt
            ${{ matrix.build }}/SHA256SUMS
